name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  GODOT_VERSION: '4.7.1'
  GODOT_CHANNEL: stable

jobs:
  determinism-parity:
    name: release-determinism-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Restore deterministic test dependencies
        run: dotnet restore tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj

      - name: Build deterministic test assembly
        run: >-
          dotnet build tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj
          -c Release --no-restore
          -p:ContinuousIntegrationBuild=true
          -warnaserror

      - name: Verify shared golden world on native OS
        run: >-
          dotnet test tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~GoldenSeedTests|FullyQualifiedName~CrossPlatformDeterminismTests"
          --logger "console;verbosity=normal"

  release:
    needs: determinism-parity
    name: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Install JSON schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema>=4.20,<5'

      - name: Verify tag, version and changelog
        id: version
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          echo "PH_VERSION=$VERSION_VALUE" >> "$GITHUB_ENV"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 tools/ci/verify-version.py --tag "$GITHUB_REF_NAME"
          else
            python3 tools/ci/verify-version.py
          fi

      - name: Restore dependencies
        run: dotnet restore tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj

      - name: Release build - warnings are errors and symbols enabled
        run: >-
          dotnet build tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj
          -c Release --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:DebugType=portable
          -p:DebugSymbols=true
          -p:Version="$PH_VERSION"
          -warnaserror

      - name: Validate JSON and repository contracts
        run: |
          python3 tools/validate-json-content.py
          python3 tools/validate-godot-text-resource-structure.py
          python3 tools/validate-localization-contract.py
          python3 tools/validate-audio-contract.py
          python3 tools/validate-developer-diagnostics-contract.py
          python3 tools/validate-section36-testing-contract.py
          python3 tools/validate-section37-build-contract.py
          python3 tools/validate-section38-architecture-contract.py
          python3 tools/validate-platform-architecture-contract.py
          python3 tools/validate-task146-base-construction-closure.py
          python3 tools/validate-task148-world-scene-coordinator.py
          python3 tools/validate-task1622-surface-presentation-hotfix.py
          python3 tools/validate-task164-surface-visual-language.py
          python3 tools/validate-task166-planetary-weather.py
          python3 tools/validate-task168-planetary-globe-geodesy.py
          python3 tools/validate-task170-radial-surface-frame.py
          python3 tools/validate-task172-physical-radial-surface.py
          python3 tools/validate-task1721-radial-hotfix.py
          python3 tools/validate-task174-curved-surface.py
          python3 tools/validate-task1741-cold-start-safety.py
          python3 tools/validate-task1742-aerial-altitude-lifecycle-hotfix.py
          python3 tools/validate-task176-planetary-surface-subsystem.py
          python3 tools/validate-task1761-aerial-altitude-runtime-hotfix.py
          python3 tools/validate-task178-spaceflight-navigation-subsystem.py
          python3 tools/validate-task1781-pilot-input-ownership-hotfix.py
          python3 tools/validate-task1782-orbital-navigation-presentation.py
          python3 tools/validate-task1783-orbital-handoff-recovery.py
          python3 tools/validate-task1784-planetary-landing-lighting.py
          python3 tools/validate-task1785-spaceflight-kinematics-collision.py
          python3 tools/validate-task1786-orbital-scale-mouse-surface.py
          python3 tools/validate-task1787-surface-brake-handoff.py
          python3 tools/validate-task180-production-visual-language.py
          python3 tools/validate-task1801-runtime-integrity-hotfix.py
          python3 tools/validate-task1802-flight-feel-hotfix.py
          python3 tools/validate-task1803-flight-control-log-integrity.py
          python3 tools/validate-task182-flight-runtime-closure.py
          python3 tools/validate-task184-production-asset-pipeline.py
          python3 tools/validate-task1841-production-asset-build-hotfix.py
          python3 tools/validate-task186-hard-surface-visual-redesign.py
          python3 tools/validate-task188-planetary-water.py
          python3 tools/validate-task190-atmosphere-clouds.py
          python3 tools/validate-task192-planetary-caves.py
          python3 tools/validate-task1921-acceptance-coherence-hotfix.py
          python3 tools/validate-task194-world-streaming.py
          python3 tools/validate-task196-regional-vegetation.py
          python3 tools/validate-task198-modular-fauna.py
          python3 tools/validate-task200-runtime-performance.py
          python3 tools/validate-task202-graphics-quality-profiles.py
          python3 tools/validate-task204-accessibility-runtime.py
          python3 tools/validate-task206-system-capability.py
          python3 tools/validate-task208-texture-lighting-budgets.py
          python3 tools/validate-task210-galaxy-expedition.py
          python3 tools/validate-task212-cross-platform-determinism.py
          python3 tools/validate-task214-endurance-soak.py
          python3 tools/validate-task216-production-model-art.py
          python3 tools/validate-task218-production-surface-art.py

      - name: Unit tests and coverage
        run: >-
          dotnet test tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj
          -c Release --no-build --no-restore
          --collect:"XPlat Code Coverage"
          --settings tests/coverlet.runsettings
          --results-directory artifacts/test-results
          --logger "trx;LogFileName=section36-release.trx"

      - name: Enforce coverage thresholds
        run: python3 tools/verify-section36-coverage.py --results-dir artifacts/test-results

      - name: Verify save migrations and recovery explicitly
        run: >-
          dotnet test tests/ProjectHorizon.Tests/ProjectHorizon.Tests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~ProjectHorizon.Tests.Persistence.PersistenceTests"

      - name: Install official Godot .NET editor and export templates
        run: ./tools/ci/bootstrap-godot.sh

      - name: Headless primary and Compatibility Release exports
        run: ./tools/ci/export-project.sh release

      - name: Package release, symbols and checksums
        run: >-
          python3 tools/ci/package-release.py
          --version "$PH_VERSION"
          --commit "$GITHUB_SHA"
          --exports artifacts/exports
          --output artifacts/release

      - name: Verify packaged checksums
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: ProjectHorizon-${{ steps.version.outputs.version }}-release
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$PH_VERSION"
          artifacts/release/ProjectHorizon-*-windows-x64.zip
          artifacts/release/ProjectHorizon-*-linux-x86_64.tar.gz
          artifacts/release/ProjectHorizon-*-windows-x64-compatibility.zip
          artifacts/release/ProjectHorizon-*-linux-x86_64-compatibility.tar.gz
          artifacts/release/ProjectHorizon-*-symbols.zip
          artifacts/release/release-manifest.json
          artifacts/release/SHA256SUMS.txt
          artifacts/release/VERSION
          artifacts/release/CHANGELOG.md
          --verify-tag
          --title "Project Horizon $PH_VERSION"
          --notes-file artifacts/release/RELEASE_NOTES.md
